name: Build

# Dockerfile-validity check: builds the images on every PR and push to main, pushes
# nothing (release.yml pushes, at a version tag). Also evaluates the tenant flake so a
# broken deploy/incus/*.nix or a krg-infra contract change fails here, not on the slot.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: api
          - context: web
          # Built from upstream at deploy/translation-server.ref (see release.yml).
          - context: upstream/translation-server
            upstream: zotero/translation-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Upstream commit
        if: matrix.upstream
        id: upstream
        run: echo "ref=$(cat deploy/translation-server.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.upstream
        with:
          repository: ${{ matrix.upstream }}
          ref: ${{ steps.upstream.outputs.ref }}
          path: ${{ matrix.context }}
          submodules: recursive
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: false
          build-args: |
            VITE_API_URL=/api

  tenant-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Evaluate the slot's NixOS config
        run: nix eval --raw .#nixosConfigurations.reference-manager.config.system.build.toplevel.drvPath
