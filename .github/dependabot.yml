# Keeps the SHA-pinned third-party actions in .github/workflows current. Dependabot
# understands `uses: owner/repo@<sha> # vX.Y.Z` and bumps the SHA and the comment
# together. Grouped, so routine bumps arrive as one weekly PR instead of eight.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
