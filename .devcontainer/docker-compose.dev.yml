# Dev-container overlay. Adds a `dev` tooling service to the existing stack.
# Only loaded by VS Code / the Dev Containers CLI (referenced from devcontainer.json);
# a plain `docker compose up` on the host does NOT include this file or the `dev` service.
services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    command: sleep infinity
    volumes:
      # Mount the repo at the SAME absolute path as the host. This makes Claude Code's
      # path-keyed state (per-project memory + history) map unchanged inside the
      # container. '..' is the repo root (resolved relative to this .devcontainer file).
      # NOTE: this path is host-specific (currently chris's). When teammates join,
      # switch back to a generic /workspaces mount or parameterize this.
      - ..:/home/chris/Repos/school/e4e/e4e-reference-manager:cached
    environment:
      # Reach the other services by their compose names from inside the dev container
      REFMAN_DATABASE_URL: postgresql+asyncpg://refman:refman@postgres:5432/refman
      REFMAN_S3_ENDPOINT_URL: http://seaweedfs:8333
      REFMAN_S3_PUBLIC_ENDPOINT_URL: http://localhost:8333
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      api:
        condition: service_started
      web:
        condition: service_started
