# e4e-reference-manager INTERIOR — the KRG Incus platform's `reference-manager` tenant
# (ADR 0017 / 0020), serving https://bib.krg.ucsd.edu. Mirrors fishsense-services'
# deploy/incus/compose.yml.
#
# Converged by `nixos-rebuild`, never by hand: the repo-root flake.nix hands this file
# to mkTenant, and krg's composeStack runs
#   docker compose --project-directory /var/lib/krg/reference-manager -f <this> up -d --remove-orphans --force-recreate
# So the compose PROJECT is `reference-manager`, and the named volumes below are
# `reference-manager_<name>`: rename one and the converge starts empty. Relative paths
# (`./x`) resolve against /var/lib/krg/reference-manager, where workdir.nix links the
# committed config.
#
# INGRESS CONTRACT (wired admin-side in krg-infra — do not change the shape):
#   public -> krg-prod edge (prod LE cert for bib.krg.ucsd.edu, TLS-terminate)
#          -> re-encrypt HTTPS, verify serverName=reference-manager.vm vs the fleet CA
#          -> krg-nat:30444 -> incus_network_forward -> 10.100.0.11:443 (traefik below)
#
# ONE ORIGIN: bib.krg.ucsd.edu/api/* is the API (prefix stripped; uvicorn
# --root-path /api), everything else is the static web build with SPA fallback.
# PDFs are NOT served here: the API presigns path-style GETs on
# https://s3.e4e.ucsd.edu (e4e-nas Garage, bucket `reference-manager`) and the browser
# fetches them directly (the bucket's CORS allows this origin; krg-infra
# spec/e4e-nas/garage.yml).
#
# Secrets come from the in-VM vault-agent as env files under /run/tenant/secrets
# (secrets.nix) — never in this file. Every image is pinned; the two
# ghcr.io/ucsd-e4e/e4e-reference-manager-* pins move together, one release at a time.
#
# deploy/incus/prune.nix greps every `image:` below and never removes one of them —
# keep each on its own `image: <name>:<tag>` line.

# Bounded container logs. Docker's default json-file driver never rotates, and on a
# 60 GB slot that runs at ~97% (GROBID's image alone is 32 GB) a chatty service can
# fill the disk — which on 2026-10-20 took postgres, and with it the whole site, down.
# `local` is docker's compressed, rotating driver; `docker logs` works the same.
# 3 × 10 MB per container, ~10 containers → ≤ ~300 MB worst case.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  # ── inner edge: TLS on :443 with reference-manager.vm, route path → container ───────
  traefik:
    image: traefik:3.7.8
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.websecure.address=:443
    ports:
      # The ONE published port, and it must be on 0.0.0.0: the incus_network_forward
      # DNATs krg-nat:30444 to the instance NIC's :443. (krg.docker.defaultPublishAddress
      # would bind an unprefixed publish to loopback, where the forward can't reach it.)
      # Nothing else here publishes a port.
      - "0.0.0.0:443:443"
    volumes:
      - /run/tenant/tls:/etc/traefik/tls:ro # reference-manager.vm.{crt,key} — vault-agent (nixosModules.tenant)
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    # Deliberately NO depends_on: the file provider routes to http://api:8000 and
    # http://web:8080 by name and needs neither up to start (a backend that isn't
    # there yet is a 502 for that route only). With `depends_on: [web, api]` a sick
    # api — e.g. postgres unable to start on a full disk — left traefik `Created`, so
    # the static web build went down with it.
    networks: [interior]
    logging: *logging

  # ── Postgres + pgvector (embeddings) ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: refman
      POSTGRES_DB: refman
    # POSTGRES_PASSWORD from the vault-agent render (generated/app.db_password). The
    # image applies it ONLY when initialising an empty volume; afterwards the role's
    # password lives in the database, which is why that secret is generate-once.
    env_file:
      - /run/tenant/secrets/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refman -d refman"]
      interval: 5s
      timeout: 5s
      retries: 30
    expose: ["5432"]
    networks: [interior]
    logging: *logging
    # No mem_limit: postgres is what must survive memory pressure (see grobid/ollama).

  # ── API → bib.krg.ucsd.edu/api (FastAPI; migrations, then uvicorn) ───────────────────
  api:
    image: ghcr.io/ucsd-e4e/e4e-reference-manager-api:v1.16.1
    restart: unless-stopped
    # Migrations run on every start, before the server: a failing migration keeps the
    # API down (and the converge's verify red) rather than serving a stale schema.
    # --root-path /api: the inner Traefik strips /api, so the app's routes stay
    # prefix-free while every URL it generates (docs, redirects) carries /api.
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --root-path /api
    environment:
      # Run from the image's prebuilt venv. Without this `uv run` re-syncs at start,
      # installing the project — which fetches its build backend (hatchling) from PyPI
      # on every container start. (App change: install the project in the image.)
      UV_NO_SYNC: "1"
      REFMAN_APP_BASE_URL: https://bib.krg.ucsd.edu/api
      # Same origin as the web build, so no CORS needed (and none allowed).
      REFMAN_CORS_ORIGINS: "[]"
      # e4e-nas Garage via its public S3 endpoint. Path-style presigned GETs; the
      # browser fetches them from the same host, so both endpoints are the public one.
      REFMAN_S3_ENDPOINT_URL: https://s3.e4e.ucsd.edu
      REFMAN_S3_PUBLIC_ENDPOINT_URL: https://s3.e4e.ucsd.edu
      # MUST be `garage`: Garage rejects SigV4 signed for any other region, and the
      # app's default (us-east-1) breaks every upload and presign.
      REFMAN_S3_REGION: garage
      REFMAN_S3_BUCKET: reference-manager
      REFMAN_DEV_AUTH: "false"
      REFMAN_OIDC_REDIRECT_URI: https://bib.krg.ucsd.edu/api/auth/callback
      REFMAN_POST_LOGIN_REDIRECT: https://bib.krg.ucsd.edu/
      # Optional: members of this Authentik/AD group become org admins. Group names
      # reach the token only once the app requests the `groups` scope (HANDOFF §6).
      # REFMAN_OIDC_ADMIN_GROUP: "<AD group name>"
      REFMAN_TRANSLATION_SERVER_URL: http://translation-server:1969
      REFMAN_GROBID_URL: http://grobid:8070
      REFMAN_OLLAMA_URL: http://ollama:11434
    # REFMAN_DATABASE_URL, REFMAN_SESSION_SECRET, REFMAN_S3_ACCESS_KEY/_SECRET_KEY,
    # REFMAN_OIDC_ISSUER/_CLIENT_ID/_CLIENT_SECRET — from the vault-agent render.
    env_file:
      - /run/tenant/secrets/api.env
    expose: ["8000"]
    # GET /health (api/app/routers/health.py) from inside the container. The image is
    # python:3.12-slim (no curl/wget), so the stdlib does it. start_period covers the
    # migrations and the lifespan's storage/OIDC setup before uvicorn listens. Docker
    # doesn't restart an unhealthy container; this is for `docker ps`/operators —
    # deploy.yml's verify checks the same endpoint through traefik.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3m
      start_interval: 5s
    depends_on:
      postgres:
        condition: service_healthy
      # Not on grobid/ollama/translation-server: the API starts without them and its
      # ingest calls fail loudly until they're up (GROBID takes ~1 min to warm).
    networks: [interior]
    logging: *logging

  # ── web → bib.krg.ucsd.edu/* (static Vite/React PWA build, SPA fallback) ─────────────
  # Built with VITE_API_URL=/api (the API is same-origin under /api). A static server
  # (nginx) — never the Vite dev server.
  web:
    image: ghcr.io/ucsd-e4e/e4e-reference-manager-web:v1.16.1
    restart: unless-stopped
    expose: ["8080"]
    # nginx-unprivileged:*-alpine ships busybox wget. 127.0.0.1, not localhost: nginx
    # listens on IPv4 only and busybox may try ::1 first.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [interior]
    logging: *logging

  # ── ingestion: Zotero translation-server (URL/DOI → metadata) ────────────────────────
  # Built by release.yml from zotero/translation-server at deploy/translation-server.ref:
  # Zotero publishes amd64 images only up to 2.0.4, whose runtime can't run current
  # translators. Each release rebuilds it, picking up the latest translators.
  translation-server:
    image: ghcr.io/ucsd-e4e/e4e-reference-manager-translation-server:v1.16.1
    restart: unless-stopped
    expose: ["1969"]
    networks: [interior]
    logging: *logging

  # ── MEMORY BUDGET (12 GiB slot, no swap) ─────────────────────────────────────────────
  # GROBID and Ollama are the only big, spiky consumers; without limits either can push
  # the VM into the kernel OOM killer, which may pick postgres. Capped so that, even with
  # both at their cap (7.5 GiB), ~4.5 GiB remain for postgres (shared_buffers 128 MB),
  # api, web, traefik, translation-server and the OS. Hitting a cap OOM-kills inside
  # that container only (restart: unless-stopped brings it back) — an ingest/summary
  # fails, the library stays up. Estimates, not measurements: check `docker stats` on
  # the slot under a real ingest and adjust.

  # ── ingestion: GROBID (PDF → structured metadata + references) ───────────────────────
  # The CRF-only image (no deep-learning models): 1.7 GB on disk instead of the full
  # image's 32.5 GB of mostly CUDA/TensorFlow, which a CPU-only slot never used. That
  # one image was over half of the 60 GB disk, which filled on 2026-10-20. Header and
  # reference extraction work the same (tested on lab papers: exact titles, authors and
  # 17/41 references); CRF is slightly less accurate than the deep-learning models.
  grobid:
    image: grobid/grobid:0.8.2-crf
    restart: unless-stopped
    environment:
      # The image's JDK (17.0.2) crashes at startup on cgroup v2 hosts like this slot
      # (NPE in CgroupInfo.getMountPoint, JDK-8287073) unless container detection is
      # off. With it off the JVM can't see mem_limit, so the heap is fixed explicitly.
      JAVA_OPTS: -XX:-UseContainerSupport -Xmx2g
    # 2 GB heap + JVM/native overhead: measured ~2.9 GB while processing two papers.
    mem_limit: 3500m
    expose: ["8070"]
    networks: [interior]
    logging: *logging

  # ── local ML: Ollama (embeddings + summaries) ─────────────────────────────────────────
  # CPU-only (the slot has no GPU). Models persist in the `ollama` volume.
  ollama:
    image: ollama/ollama:0.40.0
    restart: unless-stopped
    environment:
      # One request at a time: each parallel slot multiplies the KV cache, and on 6
      # CPUs parallel generations only slow each other down.
      OLLAMA_NUM_PARALLEL: "1"
      # Exactly the two models the API uses (nomic-embed-text + qwen2.5:3b), both kept
      # resident so an embed doesn't evict the chat model and vice versa.
      OLLAMA_MAX_LOADED_MODELS: "2"
    # qwen2.5:3b Q4_K_M weights ~1.9 GB + nomic-embed-text ~0.3 GB + KV cache/compute
    # buffers for one sequence (~0.5 GB) + the server ≈ 3 GB. 4g gives headroom.
    mem_limit: 4g
    volumes:
      - ollama:/root/.ollama
    expose: ["11434"]
    networks: [interior]
    logging: *logging

  # One-shot, every converge: make sure the two models the API uses are present.
  # `ollama pull` is idempotent (an existing model is a manifest check, no re-download)
  # and talks to the server above via OLLAMA_HOST, so the models land in its volume.
  # Keep in step with the app's settings (embedding_model / llm_model). Not a
  # dependency of the API: a registry blip must not keep the app down.
  ollama-models:
    image: ollama/ollama:0.40.0
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull nomic-embed-text && ollama pull qwen2.5:3b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    networks: [interior]
    logging: *logging

  # ── daily Postgres dumps → Garage ────────────────────────────────────────────────────
  # The slot's disk is not a backup: pg-dump writes a custom-format dump to a local
  # volume about once a day; pg-backup-sync copies new dumps to
  # s3://reference-manager/_backups/postgres/ on e4e-nas (snapshotted there).
  #
  # Retention is by AGE, on both sides, and the off-box side never mirrors deletions:
  #   - local: dumps older than 14 days are deleted, but the 7 newest always stay
  #     (so a stalled dumper never ages the volume down to nothing);
  #   - Garage: `rclone copy` (never deletes), then dumps older than 30 days are
  #     deleted — only when local holds a dump from the last 48h, i.e. dumps are
  #     flowing and that fresh one was just copied, so the remote can't be emptied.
  # (It used to be count-based — 14 dumps, and every container start took one, so a
  # few releases shrank the window to 2–3 days — and an `rclone sync`, so wiping the
  # local volume wiped the off-box copies within the hour.)
  # Restore: HANDOFF.md §7.
  pg-dump:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    # Checks hourly, dumps only when the newest dump is >23h old: a container start
    # (every release force-recreates the stack) no longer adds a dump of its own, so
    # disk use stays ~one dump per day. A fresh volume still dumps at once.
    command:
      - |
        set -eu
        while :; do
          if [ -z "$$(find /backups -maxdepth 1 -name 'refman-*.dump' -mmin -1380)" ]; then
            f="/backups/refman-$$(date -u +%Y%m%dT%H%M%SZ).dump"
            if pg_dump -h postgres -U refman -d refman -Fc -f "$$f.tmp"; then
              mv "$$f.tmp" "$$f"
              echo "pg-dump: wrote $$f"
            else
              rm -f "$$f.tmp"
              echo "pg-dump: FAILED" >&2
            fi
            # Past the 7 newest, drop what is older than 14 days.
            ls -1t /backups/refman-*.dump 2>/dev/null | tail -n +8 \
              | while read -r old; do find "$$old" -mtime +13 -delete; done || true
          fi
          sleep 3600
        done
    # PGPASSWORD (the refman role's) from the vault-agent render.
    env_file:
      - /run/tenant/secrets/pg-dump.env
    volumes:
      - pgbackups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interior]
    logging: *logging

  pg-backup-sync:
    image: rclone/rclone:1.75.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    # `copy`, not `sync`: nothing deleted locally is ever deleted remotely by this.
    # The remote prune is age-based (--min-age 30d, rclone's modtime = the dump's local
    # mtime) and gated on a <48h-old local dump having just been copied — if dumps
    # stop, or the copy fails, the remote is left alone.
    command:
      - |
        dst=garage:reference-manager/_backups/postgres
        while :; do
          if rclone copy /backups "$$dst" --include 'refman-*.dump'; then
            echo "pg-backup-sync: copied"
            if [ -n "$$(rclone lsf /backups --include 'refman-*.dump' --max-age 48h)" ]; then
              rclone delete "$$dst" --include 'refman-*.dump' --min-age 30d \
                && echo "pg-backup-sync: pruned remote dumps older than 30d" \
                || echo "pg-backup-sync: remote prune FAILED" >&2
            else
              echo "pg-backup-sync: no local dump from the last 48h; not pruning the remote" >&2
            fi
          else
            echo "pg-backup-sync: FAILED" >&2
          fi
          sleep 3600
        done
    environment:
      # An rclone remote named `garage`, configured entirely from env.
      RCLONE_CONFIG_GARAGE_TYPE: s3
      RCLONE_CONFIG_GARAGE_PROVIDER: Other
      RCLONE_CONFIG_GARAGE_ENDPOINT: https://s3.e4e.ucsd.edu
      RCLONE_CONFIG_GARAGE_REGION: garage
      RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE: "true"
    # RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID / _SECRET_ACCESS_KEY (the app's Garage key)
    # from the vault-agent render.
    env_file:
      - /run/tenant/secrets/pg-backup-sync.env
    volumes:
      - pgbackups:/backups:ro
    networks: [interior]
    logging: *logging

volumes:
  pgdata:
  ollama:
  pgbackups:

networks:
  interior:
    driver: bridge
