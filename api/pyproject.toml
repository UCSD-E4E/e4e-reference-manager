[project]
name = "e4e-refman-api"
version = "1.5.0"
description = "Backend API for the e4e reference manager"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "boto3>=1.34",
    "bibtexparser>=1.4,<2.0",
    "python-multipart>=0.0.31",
    "pymupdf>=1.27.2.3",
    "pgvector>=0.4.2",
    "numpy>=2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
